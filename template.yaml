AWSTemplateFormatVersion: '2010-09-09'
Description: 'another_betterthannothing_vpn - Disposable VPN infrastructure with WireGuard'

Parameters:
  VpcCidr:
    Type: String
    Default: '10.10.0.0/16'
    Description: 'CIDR block for the VPC (must be RFC 1918 private range)'
    AllowedPattern: '^(10\.(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){2}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])/(1[6-9]|2[0-8])|172\.(1[6-9]|2[0-9]|3[0-1])\.(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){1}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])/(1[6-9]|2[0-8])|192\.168\.(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){1}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])/(1[6-9]|2[0-8]))'
    ConstraintDescription: 'Must be a valid RFC 1918 private CIDR block with prefix length between /16 and /28'

  InstanceType:
    Type: String
    Default: 't4g.nano'
    Description: 'EC2 instance type for the VPN server'

  InstanceArchitecture:
    Type: String
    Default: 'arm64'
    Description: 'CPU architecture for the instance (arm64 for t4g/m6g/c6g, x86_64 for t3/m5/c5)'
    AllowedValues:
      - 'arm64'
      - 'x86_64'

  VpnPort:
    Type: Number
    Default: 51820
    Description: 'Port number for VPN traffic'
    MinValue: 1024
    MaxValue: 65535

  VpnProtocol:
    Type: String
    Default: 'udp'
    Description: 'Protocol for VPN traffic'
    AllowedValues:
      - 'udp'
      - 'tcp'

  AllowedIngressCidr:
    Type: String
    Default: '0.0.0.0/0'
    Description: 'Source CIDR allowed to connect to the VPN port (use --my-ip for better security)'
    AllowedPattern: '^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])/([0-9]|[12][0-9]|3[0-2])$'
    ConstraintDescription: 'Must be a valid CIDR block (e.g., 203.0.113.0/24 or 0.0.0.0/0)'

  AllowedIngressCidr2:
    Type: String
    Default: 'NONE'
    Description: 'Optional additional source CIDR allowed to connect to the VPN port'
    AllowedPattern: '^(NONE|(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])/([0-9]|[12][0-9]|3[0-2]))$'
    ConstraintDescription: 'Must be NONE or a valid CIDR block'

  AllowedIngressCidr3:
    Type: String
    Default: 'NONE'
    Description: 'Optional additional source CIDR allowed to connect to the VPN port'
    AllowedPattern: '^(NONE|(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])/([0-9]|[12][0-9]|3[0-2]))$'
    ConstraintDescription: 'Must be NONE or a valid CIDR block'

  AllowedIngressCidr4:
    Type: String
    Default: 'NONE'
    Description: 'Optional additional source CIDR allowed to connect to the VPN port'
    AllowedPattern: '^(NONE|(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])/([0-9]|[12][0-9]|3[0-2]))$'
    ConstraintDescription: 'Must be NONE or a valid CIDR block'

  AllowedIngressCidr5:
    Type: String
    Default: 'NONE'
    Description: 'Optional additional source CIDR allowed to connect to the VPN port'
    AllowedPattern: '^(NONE|(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])/([0-9]|[12][0-9]|3[0-2]))$'
    ConstraintDescription: 'Must be NONE or a valid CIDR block'

  UseSpotInstance:
    Type: String
    Default: 'false'
    Description: 'Use EC2 Spot instance instead of on-demand (lower cost but can be interrupted)'
    AllowedValues:
      - 'true'
      - 'false'

  AllocateEIP:
    Type: String
    Default: 'false'
    Description: 'Allocate an Elastic IP for persistent public IP address'
    AllowedValues:
      - 'true'
      - 'false'

Conditions:
  UseSpot: !Equals [!Ref UseSpotInstance, 'true']
  ShouldAllocateEIP: !Equals [!Ref AllocateEIP, 'true']
  IsArm64: !Equals [!Ref InstanceArchitecture, 'arm64']
  HasCidr2: !Not [!Equals [!Ref AllowedIngressCidr2, 'NONE']]
  HasCidr3: !Not [!Equals [!Ref AllowedIngressCidr3, 'NONE']]
  HasCidr4: !Not [!Equals [!Ref AllowedIngressCidr4, 'NONE']]
  HasCidr5: !Not [!Equals [!Ref AllowedIngressCidr5, 'NONE']]

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-vpc'
        - Key: CostCenter
          Value: !Ref AWS::StackName

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 1, 8]]
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-public-subnet'
        - Key: CostCenter
          Value: !Ref AWS::StackName

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-igw'
        - Key: CostCenter
          Value: !Ref AWS::StackName

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-public-rt'
        - Key: CostCenter
          Value: !Ref AWS::StackName

  DefaultPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: '0.0.0.0/0'
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  VpnSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${AWS::StackName}-vpn-sg'
      GroupDescription: 'Security group for VPN server - allows only VPN traffic'
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: !Ref VpnProtocol
          FromPort: !Ref VpnPort
          ToPort: !Ref VpnPort
          CidrIp: !Ref AllowedIngressCidr
          Description: 'VPN traffic from allowed CIDR 1'
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: '0.0.0.0/0'
          Description: 'Allow all outbound traffic for SSM and package installation'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-vpn-sg'
        - Key: CostCenter
          Value: !Ref AWS::StackName

  VpnIngressRule2:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasCidr2
    Properties:
      GroupId: !Ref VpnSecurityGroup
      IpProtocol: !Ref VpnProtocol
      FromPort: !Ref VpnPort
      ToPort: !Ref VpnPort
      CidrIp: !Ref AllowedIngressCidr2
      Description: 'VPN traffic from allowed CIDR 2'

  VpnIngressRule3:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasCidr3
    Properties:
      GroupId: !Ref VpnSecurityGroup
      IpProtocol: !Ref VpnProtocol
      FromPort: !Ref VpnPort
      ToPort: !Ref VpnPort
      CidrIp: !Ref AllowedIngressCidr3
      Description: 'VPN traffic from allowed CIDR 3'

  VpnIngressRule4:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasCidr4
    Properties:
      GroupId: !Ref VpnSecurityGroup
      IpProtocol: !Ref VpnProtocol
      FromPort: !Ref VpnPort
      ToPort: !Ref VpnPort
      CidrIp: !Ref AllowedIngressCidr4
      Description: 'VPN traffic from allowed CIDR 4'

  VpnIngressRule5:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasCidr5
    Properties:
      GroupId: !Ref VpnSecurityGroup
      IpProtocol: !Ref VpnProtocol
      FromPort: !Ref VpnPort
      ToPort: !Ref VpnPort
      CidrIp: !Ref AllowedIngressCidr5
      Description: 'VPN traffic from allowed CIDR 5'

  VpnInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-vpn-instance-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-vpn-instance-role'
        - Key: CostCenter
          Value: !Ref AWS::StackName

  VpnInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub '${AWS::StackName}-vpn-instance-profile'
      Roles:
        - !Ref VpnInstanceRole

  # Launch Template shared by on-demand and spot launches.
  # Spot uses a one-time request: it cannot be stopped/restarted and is not
  # relaunched on interruption, but stack deletion cleanly terminates everything
  # (a persistent request would respawn instances outside CloudFormation control).
  VpnLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub '${AWS::StackName}-launch-template'
      LaunchTemplateData:
        ImageId: !If
          - IsArm64
          - '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64}}'
          - '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Arn: !GetAtt VpnInstanceProfile.Arn
        SecurityGroupIds:
          - !Ref VpnSecurityGroup
        InstanceMarketOptions: !If
          - UseSpot
          - MarketType: spot
            SpotOptions:
              SpotInstanceType: one-time
              InstanceInterruptionBehavior: terminate
          - !Ref AWS::NoValue
        MetadataOptions:
          HttpTokens: required
          HttpPutResponseHopLimit: 1
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 8
              VolumeType: gp3
              Encrypted: true
              DeleteOnTermination: true
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euo pipefail

            # Update SSM agent if needed
            dnf install -y amazon-ssm-agent || yum install -y amazon-ssm-agent
            systemctl enable amazon-ssm-agent
            systemctl start amazon-ssm-agent

            # Set hostname
            hostnamectl set-hostname ${AWS::StackName}-vpn-server

            # Log completion
            echo "UserData script completed successfully" > /var/log/userdata-complete.log
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub '${AWS::StackName}-vpn-server'
              - Key: CostCenter
                Value: !Ref AWS::StackName
          - ResourceType: volume
            Tags:
              - Key: Name
                Value: !Sub '${AWS::StackName}-vpn-volume'
              - Key: CostCenter
                Value: !Ref AWS::StackName

  VpnInstance:
    Type: AWS::EC2::Instance
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref VpnLaunchTemplate
        Version: !GetAtt VpnLaunchTemplate.LatestVersionNumber
      SubnetId: !Ref PublicSubnet
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-vpn-server'
        - Key: CostCenter
          Value: !Ref AWS::StackName

  VpnEIP:
    Type: AWS::EC2::EIP
    Condition: ShouldAllocateEIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-eip'
        - Key: CostCenter
          Value: !Ref AWS::StackName

  VpnEIPAssociation:
    Type: AWS::EC2::EIPAssociation
    Condition: ShouldAllocateEIP
    Properties:
      AllocationId: !GetAtt VpnEIP.AllocationId
      InstanceId: !Ref VpnInstance

Outputs:
  InstanceId:
    Description: 'EC2 instance ID of the VPN server'
    Value: !Ref VpnInstance
    Export:
      Name: !Sub '${AWS::StackName}-InstanceId'

  PublicIp:
    Description: 'Public IP address of the VPN server'
    Value: !If
      - ShouldAllocateEIP
      - !Ref VpnEIP
      - !GetAtt VpnInstance.PublicIp
    Export:
      Name: !Sub '${AWS::StackName}-PublicIp'

  HasElasticIP:
    Description: 'Boolean indicating whether an Elastic IP was allocated'
    Value: !Ref AllocateEIP
    Export:
      Name: !Sub '${AWS::StackName}-HasElasticIP'

  IsSpotInstance:
    Description: 'Boolean indicating whether the instance is a Spot instance'
    Value: !Ref UseSpotInstance
    Export:
      Name: !Sub '${AWS::StackName}-IsSpotInstance'

  VpcId:
    Description: 'VPC ID'
    Value: !Ref VPC
    Export:
      Name: !Sub '${AWS::StackName}-VpcId'

  VpcCidr:
    Description: 'VPC CIDR block'
    Value: !Ref VpcCidr
    Export:
      Name: !Sub '${AWS::StackName}-VpcCidr'

  Region:
    Description: 'AWS Region where the stack is deployed'
    Value: !Ref AWS::Region
    Export:
      Name: !Sub '${AWS::StackName}-Region'

  VpnPort:
    Description: 'VPN listening port'
    Value: !Ref VpnPort
    Export:
      Name: !Sub '${AWS::StackName}-VpnPort'

  VpnProtocol:
    Description: 'VPN protocol (udp or tcp)'
    Value: !Ref VpnProtocol
    Export:
      Name: !Sub '${AWS::StackName}-VpnProtocol'

  InstanceArchitecture:
    Description: 'CPU architecture of the instance'
    Value: !Ref InstanceArchitecture
    Export:
      Name: !Sub '${AWS::StackName}-InstanceArchitecture'
